<style>
:root{

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Be Vietnam Pro","Noto Sans TC",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.55}
header{background:var(--brand);color:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.hwrap{max-width:1100px;margin:0 auto;padding:12px 16px 0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:700;letter-spacing:.14em;font-size:20px}
.logo small{display:block;font-weight:400;letter-spacing:0;font-size:12px;opacity:.8}
.site{margin-left:auto;color:#fff;text-decoration:none;font-size:13px;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:5px 12px}
.site:hover{background:rgba(255,255,255,.14)}
.langs{display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:3px}
.langs button{border:0;background:transparent;color:#fff;font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;cursor:pointer}
.langs button.on{background:#fff;color:var(--brand);font-weight:600}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{color:rgba(255,255,255,.78);text-decoration:none;padding:9px 14px;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent}
nav a.on{color:#fff;border-color:var(--accent);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
section{display:none}
section.on{display:block}
h2{font-size:20px;margin:6px 0 4px}
h3{font-size:16px;margin:22px 0 8px;color:var(--brand)}
.sub{color:var(--ink2);margin:0 0 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv b{color:var(--ink2);font-weight:500}
.tbd{display:inline-block;background:var(--tbd-bg);color:var(--tbd-ink);border:1px dashed #e0b45c;border-radius:4px;padding:0 5px;font-size:.88em;font-weight:500}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;white-space:nowrap}
.chip.sale{background:#e3f3e8;color:var(--ok)}
.chip.soon{background:#fdf0dc;color:var(--warn)}
.chip.cat{background:#e6f0f2;color:var(--brand)}
ol.flow{counter-reset:s;list-style:none;padding:0;margin:0}
ol.flow li{counter-increment:s;position:relative;padding:0 0 12px 40px}
ol.flow li:before{content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center}
ol.flow li b{display:block}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.split{grid-template-columns:1fr}}
.bc{border-left:4px solid var(--accent)}
.bb{border-left:4px solid var(--brand2)}
/* FAQ */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
input[type=search],input.own{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 11px;background:#fff}
input[type=search]{flex:1;min-width:200px}
.fbtn{border:1px solid var(--line);background:#fff;font:inherit;font-size:13px;padding:6px 11px;border-radius:999px;cursor:pointer;color:var(--ink2)}
.fbtn.on{background:var(--brand);border-color:var(--brand);color:#fff}
details.faq{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
details.faq summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none;display:flex;gap:10px;align-items:flex-start}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary .n{color:var(--mute);font-weight:500;min-width:24px}
details.faq summary .q{flex:1}
details.faq[open] summary{border-bottom:1px solid var(--line)}
.ans{padding:12px 14px 14px 48px}
.ans p{margin:0 0 6px}
.ans .other{color:var(--mute);font-size:13px;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.tip{font-size:13px;color:var(--warn);margin-top:6px}

.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#eef3f5;font-weight:600;font-size:13px;color:var(--ink2);white-space:nowrap;position:sticky;top:0}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.sku{font-weight:700;color:var(--brand);white-space:nowrap}
td.sku a,a.pl{color:var(--brand);text-decoration:none}
td.sku a:after{content:" ↗";font-weight:400;font-size:11px}
a.pl:hover,td.sku a:hover{text-decoration:underline}
.qr{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qr svg{border:1px solid var(--line);border-radius:8px;flex:none}

tr.done td{background:#f2f8f3}
tr.done td.nm{text-decoration:line-through;color:var(--mute)}
.mkt{font-size:12px;color:var(--mute)}
tfoot td{font-weight:600;background:#fafbfb}

.bar i{display:block;height:100%;background:var(--ok);width:0}
.cnt{font-size:13px;color:var(--mute)}

input.own{padding:4px 8px;width:110px;font-size:13px}
.note{font-size:12.5px;color:var(--mute)}
.new{font-size:11px;background:#e6f0f2;color:var(--brand);border-radius:4px;padding:0 5px;margin-left:4px}
.legend{font-size:13px;color:var(--ink2);margin:0 0 12px}
.btnrow{display:flex;gap:8px;margin:6px 0 4px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
table.edt td{padding:5px 6px;vertical-align:middle}
input.ed,input.ced{font:inherit;font-size:13.5px;border:1px solid transparent;border-radius:6px;padding:5px 6px;background:transparent;width:100%;min-width:0;color:inherit}
input.ced:hover,input.ed:hover{border-color:var(--line)}
input.ced:focus,input.ed:focus{border-color:var(--brand2);background:#fff;outline:none}
input.ced.empty,input.ed.empty{background:var(--tbd-bg);border:1px dashed #e0b45c}
input.ed[type=number]{text-align:right}

 {c:'co',q:{zh:'你們公司在哪裡？',en:'Where is your company located?',vi:'Công ty bạn ở đâu?'},
  a:{zh:'VIEMAG 是越南品牌，由越南公司 PERIPOWER VIETNAM CO., LTD. 代理，公司在越南北寧（1st Floor, Plot No. 394, Map Sheet No. 3, Tran Quoc Tang Street, Vo Cuong Ward, Bac Ninh City, Vietnam），電話 0345 026 866。產品資訊都可以在官網 viemag.biz 查看。',
     en:'VIEMAG is a Vietnamese brand represented by PERIPOWER VIETNAM CO., LTD., a Vietnamese company based in Bac Ninh (1st Floor, Plot No. 394, Map Sheet No. 3, Tran Quoc Tang Street, Vo Cuong Ward, Bac Ninh City, Vietnam), tel. 0345 026 866. Full product information is on our website viemag.biz.',

 {c:'co',q:{zh:'VIEMAG 是哪裡的品牌？是中國品牌嗎？',en:'Where is VIEMAG from? Is it a Chinese brand?',vi:'VIEMAG là thương hiệu nước nào? Có phải hàng Trung Quốc không?'},
  a:{zh:'不是。VIEMAG 是越南品牌，專注 MagSafe 磁吸支架，產品是依越南使用者的習慣挑選與開發的，涵蓋車用、桌面、健身、旅行。',
     en:'No. VIEMAG is a Vietnamese brand focused on MagSafe magnetic mounts, selected and developed around how people in Vietnam use their phones — for car, desk, gym and travel.',
     vi:'Không. VIEMAG là thương hiệu Việt Nam, chuyên giá đỡ từ tính MagSafe, sản phẩm được chọn lọc và phát triển theo thói quen của người dùng Việt Nam — cho ô tô, bàn làm việc, gym và du lịch.'}},
 {c:'co',q:{zh:'公司叫 PERIPOWER VIETNAM，跟 peripower 品牌有什麼關係？',en:'Your company is PERIPOWER VIETNAM — how is that related to the peripower brand?',vi:'Công ty tên PERIPOWER VIETNAM — có liên quan gì đến thương hiệu peripower?'},
  a:{zh:'PERIPOWER VIETNAM 是一間越南公司，代理多個品牌，VIEMAG 和 peripower 都是其中之一。這次展覽我們展出的是 VIEMAG。',
     en:'PERIPOWER VIETNAM is a Vietnamese company that represents several brands — VIEMAG and peripower are two of them. At this show we are presenting VIEMAG.',
     vi:'PERIPOWER VIETNAM là một công ty Việt Nam phân phối nhiều thương hiệu, trong đó có VIEMAG và peripower. Tại triển lãm này chúng tôi giới thiệu VIEMAG.'},
  tip:{zh:'只在客人問到時回答，不要主動提；也不要談 peripower 的來源。',en:'Answer only when asked; don\'t bring it up or discuss peripower\'s origin.',vi:'Chỉ trả lời khi khách hỏi; không chủ động nhắc, không nói về nguồn gốc peripower.'}},
 {c:'co',q:{zh:'產品在哪裡生產？',en:'Where are the products made?',vi:'Sản phẩm được sản xuất ở đâu?'},
  a:{zh:'冷氣出風口支架 V01 在越南北寧生產；其他型號由長期合作的工廠依 VIEMAG 規格生產，經過品管檢驗才出貨。產地以包裝標示為準。',
     en:'The air-vent mount V01 is made in Bac Ninh, Vietnam. Other models are made by long-term partner factories to VIEMAG specifications and pass QC before shipping. Country of origin is shown on each package.',
     vi:'Giá đỡ cửa gió V01 được sản xuất tại Bắc Ninh, Việt Nam. Các mẫu khác do nhà máy đối tác lâu năm sản xuất theo thông số của VIEMAG và qua kiểm tra chất lượng (QC) trước khi xuất hàng. Xuất xứ ghi rõ trên bao bì.'},
  tip:{zh:'客人追問其他型號產地時照實回答，以包裝標示為準，不可說全部越南製造。',en:'If asked about other models\' origin, answer truthfully per the package label — never claim everything is made in Vietnam.',vi:'Nếu khách hỏi xuất xứ các mẫu khác, trả lời trung thực theo nhãn bao bì — không được nói tất cả đều sản xuất tại Việt Nam.'}},
 {c:'co',q:{zh:'這些產品網路上早就有了，你們為什麼現在才開始賣？',en:'Products like these have been online for years — why are you only selling now?',vi:'Sản phẩm kiểu này trên mạng có lâu rồi, sao bây giờ các bạn mới bán?'},
  a:{zh:'VIEMAG 是新品牌，品牌理念是「Value · Innovation · Excellence」（價值・創新・卓越）。越南市場上磁吸支架很多，但品質落差很大，所以我們只推出經過磁力、震動、溫升和耐久壽命測試的產品，給越南消費者一個可以信賴的選擇。',
     en:'VIEMAG is a new brand built on "Value · Innovation · Excellence". There are many magnetic mounts on the Vietnamese market but quality varies a lot, so we only offer products tested for magnetic force, vibration, thermal rise and lifecycle — a choice Vietnamese consumers can trust.',
     vi:'VIEMAG là thương hiệu mới với tinh thần "Value · Innovation · Excellence" (Giá trị · Đổi mới · Xuất sắc). Trên thị trường có rất nhiều giá đỡ từ tính nhưng chất lượng chênh lệch lớn, nên chúng tôi chỉ đưa ra sản phẩm đã kiểm tra lực hút, độ rung, độ tăng nhiệt và tuổi thọ — lựa chọn đáng tin cậy cho người tiêu dùng Việt Nam.'}},
 {c:'co',q:{zh:'你們的產品有出口嗎？',en:'Do you export?',vi:'Sản phẩm của các bạn có xuất khẩu không?'},
  a:{zh:'VIEMAG 目前專注越南市場。如果您有海外經銷需求，請留下名片和需求，我們展後會跟您聯繫。',
     en:'VIEMAG currently focuses on the Vietnamese market. If you are interested in overseas distribution, please leave your card and requirements and we will contact you after the show.',
     vi:'VIEMAG hiện tập trung vào thị trường Việt Nam. Nếu anh/chị có nhu cầu phân phối ở nước ngoài, vui lòng để lại danh thiếp và yêu cầu, chúng tôi sẽ liên hệ sau triển lãm.'},
  tip:{zh:'收名片並在洽談記錄本標註「海外」，展後交給 Henry。',en:'Take the card, mark "overseas" in the log, and hand it to Henry after the show.',vi:'Lấy danh thiếp, ghi "nước ngoài" trong sổ, sau triển lãm chuyển cho Henry.'}},
 {c:'co',q:{zh:'可以做 OEM/ODM 或印我們的 logo 嗎？',en:'Can you do OEM/ODM or print our logo?',vi:'Có làm OEM/ODM hoặc in logo của chúng tôi được không?'},
  a:{zh:'VIEMAG 是零售／經銷品牌，展位上不承接 OEM/ODM。不過我們可以記錄您的需求，請留下名片、產品類型和預估數量，展後會有人跟您聯繫。',
     en:'VIEMAG is a retail / distribution brand and does not take OEM/ODM orders at this booth. We can note your request though — please leave your card, product type and estimated quantity, and someone will contact you after the show.',
     vi:'VIEMAG là thương hiệu bán lẻ / phân phối, gian hàng không nhận OEM/ODM. Tuy nhiên chúng tôi có thể ghi nhận nhu cầu — vui lòng để lại danh thiếp, loại sản phẩm và số lượng dự kiến, sẽ có người liên hệ sau triển lãm.'},
  tip:{zh:'不要承諾可以做、不要提其他公司名稱。收名片，在洽談記錄本標註「OEM」，展後交給 Henry。',en:'Do not promise anything and do not mention any other company name. Take the card, mark "OEM" in the log, and hand it to Henry after the show.',vi:'Không hứa hẹn, không nhắc tên công ty nào khác. Lấy danh thiếp, ghi "OEM" trong sổ, sau triển lãm chuyển cho Henry.'}},
 {c:'co',q:{zh:'你們在越南有經銷商或門市嗎？',en:'Do you have distributors or stores in Vietnam?',vi:'Các bạn có nhà phân phối hoặc cửa hàng ở Việt Nam không?'},
  a:{zh:'可以在官網 viemag.biz 看完整產品。我們正在招募越南經銷商／代理商，提供完整產品線、穩定的價格管理、售後支援，加入門檻不高，詳見官網「經銷商」頁面。歡迎留下名片洽談。',
     en:'See the full range at viemag.biz. We are recruiting dealers and distributors in Vietnam: complete product line, price discipline, after-sales support and a low entry threshold — see the "For Dealers" page on our website. Please leave your card so we can talk.',
     vi:'Xem đầy đủ sản phẩm tại viemag.biz. Chúng tôi đang tuyển đại lý / nhà phân phối tại Việt Nam: dòng sản phẩm đầy đủ, giữ giá ổn định, hỗ trợ hậu mãi, điều kiện tham gia dễ dàng — xem trang "Đại lý" trên website. Mời anh/chị để lại danh thiếp để trao đổi.'},
  tip:{zh:'這是 B 端客人，務必收名片並記錄需求。',en:'This is a B2B lead — always collect the card and log the need.',vi:'Đây là khách B2B — nhất định lấy danh thiếp và ghi lại nhu cầu.'}},
 {c:'pr',q:{zh:'這個產品多少錢？',en:'How much is this?',vi:'Sản phẩm này giá bao nhiêu?'},
  a:{zh:'先判斷客人是 B（經銷/批發/企業）還是 C（一般消費者）。C：直接報「報價單」頁的建議售價。B：請客人留名片和 email，展後由業務提供正式報價，不要在現場報批發價。',
     en:'First identify B (dealer/wholesale/company) or C (consumer). C: quote the MSRP on the Price List tab. B: ask for a business card and email; sales will send a formal quotation after the show. Do not quote wholesale prices on the spot.',
     vi:'Trước tiên xác định khách B (đại lý/bán sỉ/doanh nghiệp) hay C (người tiêu dùng). C: báo giá bán lẻ đề xuất ở tab Bảng giá. B: xin danh thiếp và email, bộ phận kinh doanh sẽ gửi báo giá chính thức sau triển lãm. Không báo giá sỉ tại chỗ.'}},
 {c:'pr',q:{zh:'為什麼你們比網路上貴？',en:'Why are you more expensive than online?',vi:'Sao giá các bạn cao hơn trên mạng?'},
  a:{zh:'網路上很多價格是促銷折扣後或無品牌產品。我們使用 N52/N54 強磁、鋁合金或鋅合金材料，產品經過磁力、震動、溫升和耐久壽命測試，並有品牌售後服務。手機掉落維修一次的費用，遠高於支架的價差。可以現場比較磁力和做工。',
     en:'Many online prices are after-discount or for no-name products. We use strong N52/N54 magnets and aluminium or zinc alloy, test for magnetic force, vibration, thermal rise and lifecycle, and offer brand after-sales service. One dropped-phone repair costs far more than the price difference. Feel free to compare magnet strength and build quality here.',
     vi:'Nhiều giá trên mạng là giá sau khuyến mãi hoặc hàng không thương hiệu. Chúng tôi dùng nam châm mạnh N52/N54, hợp kim nhôm hoặc kẽm, kiểm tra lực hút, độ rung, độ tăng nhiệt và tuổi thọ, và có bảo hành chính hãng. Một lần sửa điện thoại bị rơi tốn hơn nhiều so với chênh lệch giá. Mời anh/chị thử lực hút và độ hoàn thiện ngay tại gian hàng.'},
  tip:{zh:'不要批評競爭品牌；讓客人親手試磁力。',en:'Never criticise competitors; let the customer feel the magnet.',vi:'Không chê đối thủ; hãy để khách tự thử lực hút.'}},
 {c:'pr',q:{zh:'量大可以優惠嗎？優惠多少？',en:'Is there a volume discount? How much?',vi:'Mua số lượng lớn có giảm giá không? Bao nhiêu?'},
  a:{zh:'當然有批量優惠。請問您對哪些產品有興趣、大概需要多少數量？麻煩留下名片，展後業務會提供報價。',
     en:'Yes, volume orders get better pricing. Which products and roughly what quantity? Please leave your card and our sales team will send a quotation after the show.',
     vi:'Có, mua số lượng lớn sẽ có giá ưu đãi. Anh/chị quan tâm sản phẩm nào và số lượng khoảng bao nhiêu? Vui lòng để lại danh thiếp, bộ phận kinh doanh sẽ gửi báo giá sau triển lãm.'}},
 {c:'pr',q:{zh:'MOQ（最低訂購量）是多少？',en:'What is the MOQ?',vi:'Số lượng đặt hàng tối thiểu (MOQ) là bao nhiêu?'},
  a:{zh:'VIEMAG 現貨經銷 MOQ ⟦待確認⟧。VIEMAG 不承接 OEM/ODM。',
     en:'VIEMAG distribution MOQ ⟦TBC⟧. VIEMAG does not take OEM/ODM orders.',
     vi:'MOQ phân phối VIEMAG ⟦chưa xác nhận⟧. VIEMAG không nhận đơn OEM/ODM.'}},
 {c:'pr',q:{zh:'現在可以買嗎？多久會收到？',en:'Can I buy now? How soon will I receive it?',vi:'Bây giờ mua được không? Bao lâu thì nhận hàng?'},
  a:{zh:'報價單標示「已上架」的產品可在 viemag.biz 購買；「即將上市」的產品上市時間 ⟦待確認⟧。下單到收貨時間 ⟦待確認⟧。展位樣品不現場販售 ⟦待確認⟧。',
     en:'Products marked "On sale" can be bought at viemag.biz; launch date for "Coming soon" items ⟦TBC⟧. Delivery time ⟦TBC⟧. Booth samples are not sold on site ⟦TBC⟧.',
     vi:'Sản phẩm ghi "Đã đăng bán" có thể mua tại viemag.biz; ngày ra mắt của sản phẩm "Sắp ra mắt" ⟦chưa xác nhận⟧. Thời gian giao hàng ⟦chưa xác nhận⟧. Không bán mẫu tại gian hàng ⟦chưa xác nhận⟧.'}},
 {c:'pr',q:{zh:'有保固嗎？',en:'Is there a warranty?',vi:'Có bảo hành không?'},
  a:{zh:'有，VIEMAG 保固期 ⟦待確認⟧。',
     en:'Yes. VIEMAG warranty period ⟦TBC⟧.',
     vi:'Có. Thời gian bảo hành VIEMAG ⟦chưa xác nhận⟧.'}},
 {c:'us',q:{zh:'磁鐵會不會傷害手機？',en:'Will the magnet damage my phone?',vi:'Nam châm có làm hỏng điện thoại không?'},
  a:{zh:'不會。MagSafe 是 Apple 的磁吸標準，iPhone 12 以後都內建磁鐵，不影響手機正常使用。提醒客人：有磁條的卡片（如部分銀行卡、房卡）不要直接貼在磁鐵上。',
     en:'No. MagSafe is Apple\'s magnetic standard — iPhone 12 and later have built-in magnets, and normal use is not affected. Reminder: keep magnetic-stripe cards (some bank cards, hotel keys) away from the magnet.',
     vi:'Không. MagSafe là chuẩn từ tính của Apple, iPhone 12 trở lên có sẵn nam châm, không ảnh hưởng sử dụng bình thường. Lưu ý: không để thẻ có dải từ (một số thẻ ngân hàng, thẻ phòng) dính trực tiếp vào nam châm.'}},
 {c:'us',q:{zh:'安卓手機或舊款 iPhone 可以用嗎？',en:'Does it work with Android or older iPhones?',vi:'Điện thoại Android hoặc iPhone đời cũ dùng được không?'},
  a:{zh:'可以。手機背面貼引磁環，或使用磁吸手機殼即可。P02 附金屬貼片；其他型號是否附引磁環 ⟦待確認⟧。',
     en:'Yes — attach a magnetic ring to the back of the phone or use a magnetic case. P02 includes a metal plate; whether other models include a ring ⟦TBC⟧.',
     vi:'Được — dán vòng hít từ ở mặt sau điện thoại hoặc dùng ốp lưng từ tính. P02 có kèm miếng kim loại; các mẫu khác có kèm vòng hít hay không ⟦chưa xác nhận⟧.'}},
 {c:'us',q:{zh:'戴手機殼可以用嗎？',en:'Does it work with a phone case?',vi:'Có ốp lưng thì dùng được không?'},
  a:{zh:'MagSafe 磁吸殼可以直接使用。一般厚殼會減弱磁力，建議在殼外貼引磁環。',
     en:'MagSafe cases work directly. Thick non-magnetic cases weaken the hold — add a magnetic ring on the outside of the case.',
     vi:'Ốp MagSafe dùng trực tiếp được. Ốp dày không từ tính sẽ làm yếu lực hút — nên dán vòng hít bên ngoài ốp.'}},
 {c:'us',q:{zh:'開車路況不好會不會掉？',en:'Will it fall off on bumpy roads?',vi:'Đi đường xóc có bị rơi không?'},
  a:{zh:'我們使用 N52/N54 強磁（V08 有 16 顆 N52），產品經過震動測試。可以請客人在展位現場搖晃測試。',
     en:'We use strong N52/N54 magnets (V08 has 16 × N52) and our products are vibration-tested. Invite the customer to shake-test it at the booth.',
     vi:'Chúng tôi dùng nam châm mạnh N52/N54 (V08 có 16 viên N52) và sản phẩm đã qua kiểm tra độ rung. Mời khách lắc thử ngay tại gian hàng.'}},

let fCat='all',fQ='';
function vFaq(){
 const X={t:{zh:'客人常見問題',en:'Customer FAQ',vi:'Câu hỏi thường gặp'},s:{zh:'VIEMAG 參展問答。點題目展開答案，下方附另外兩種語言方便對照。',en:'VIEMAG booth Q&A. Tap a question to open it; the other two languages are shown below for reference.',vi:'Hỏi đáp tại gian hàng VIEMAG. Bấm vào câu hỏi để xem; bên dưới có hai ngôn ngữ còn lại để đối chiếu.'}};
 const btn=(k,lab)=>`<button class="fbtn${fCat===k?' on':''}" data-fc="${k}">${lab}</button>`;
 return `<h2>${T(X.t)}</h2><p class="sub">${T(X.s)}</p>
 <div class="tools"><input type="search" id="fq" placeholder="${T(UI.search)}" value="${fQ.replace(/"/g,'&quot;')}"></div>
 <div class="tools">${btn('all',T(UI.all))}${Object.keys(FC).map(k=>btn(k,T(FC[k]))).join('')}
  <button class="fbtn" data-fx="1">${T(UI.expand)}</button><button class="fbtn" data-fx="0">${T(UI.collapse)}</button></div>
 <div id="flist"></div>`;
}
function renderFaqList(){
 const box=document.getElementById('flist'); if(!box) return;
 const others=['zh','en','vi'].filter(x=>x!==L);
 const q=fQ.trim().toLowerCase();
 let i=0;
 box.innerHTML=FAQ.map((f,idx)=>{
  if(fCat!=='all'&&f.c!==fCat) return '';
  const hay=(['zh','en','vi'].map(l=>f.q[l]+' '+f.a[l]).join(' ')).toLowerCase();
  if(q&&!hay.includes(q)) return '';
  i++;
  const o=others.map(l=>`<div><b>${f.q[l]}</b><br>${f.a[l].replace(/⟦(.*?)⟧/g,'<span class="tbd">$1</span>')}</div>`).join('<div style="height:6px"></div>');
  return `<details class="faq"><summary><span class="n">${idx+1}</span><span class="q">${T(f.q)}</span><span class="chip cat">${T(FC[f.c])}</span></summary>
   <div class="ans"><p>${fmt(f.a)}</p>${f.tip?`<div class="tip">💡 ${T(f.tip)}</div>`:''}<div class="other">${o}</div></div></details>`;
 }).join('')||`<p class="sub">—</p>`;
}

}

 d.map((g,gi)=>{const n=g.items.length,dn=g.items.filter(x=>x.done).length;

}
function ckCounts(){const d=ckData();d.forEach((g,gi)=>{const n=g.items.length,dn=g.items.filter(x=>x.done).length;const c=document.querySelector(`[data-gc="${gi}"]`),b=document.querySelector(`[data-gb="${gi}"]`);if(c)c.textContent=dn+' / '+n;if(b)b.style.width=(n?dn/n*100:0)+'%';});}
function ckFind(d,id){for(const g of d){const x=g.items.find(y=>y.id===id);if(x)return [g,x];}return [null,null];}

/* ---------- minimal XLSX writer (no external library, works offline) ---------- */
const XL=(()=>{
 const crcT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
 const crc=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=crcT[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
 const enc=new TextEncoder();
 function zip(files){const parts=[],cd=[];let off=0;
  for(const [name,str] of files){const nb=enc.encode(name),db=enc.encode(str),c=crc(db);
   const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint32(14,c,true);h.setUint32(18,db.length,true);h.setUint32(22,db.length,true);h.setUint16(26,nb.length,true);
   parts.push(new Uint8Array(h.buffer),nb,db);
   const d=new DataView(new ArrayBuffer(46));d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);d.setUint16(8,0x0800,true);d.setUint32(16,c,true);d.setUint32(20,db.length,true);d.setUint32(24,db.length,true);d.setUint16(28,nb.length,true);d.setUint32(42,off,true);
   cd.push(new Uint8Array(d.buffer),nb);off+=30+nb.length+db.length;}
  const cdLen=cd.reduce((a,b)=>a+b.length,0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdLen,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cd,new Uint8Array(e.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});}
 const x=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
 const col=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
 /* styles: 0 normal(wrap) 1 header 2 #,##0 3 0.00 4 total label 5 total #,##0 6 title */
 const STY=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0"/></numFmts><fonts count="4"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="14"/><name val="Calibri"/></font></fonts><fills count="4"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF0E5E6F"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFEEF3F5"/></patternFill></fill></fills><borders count="2"><border/><border><left style="thin"><color rgb="FFD0D7DC"/></left><right style="thin"><color rgb="FFD0D7DC"/></right><top style="thin"><color rgb="FFD0D7DC"/></top><bottom style="thin"><color rgb="FFD0D7DC"/></bottom></border></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="7"><xf borderId="1" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf><xf fontId="1" fillId="2" borderId="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf><xf numFmtId="164" borderId="1" applyNumberFormat="1" applyBorder="1" applyAlignment="1"><alignment vertical="top"/></xf><xf numFmtId="2" borderId="1" applyNumberFormat="1" applyBorder="1" applyAlignment="1"><alignment vertical="top"/></xf><xf fontId="2" fillId="3" borderId="1" applyFont="1" applyFill="1" applyBorder="1"/><xf numFmtId="164" fontId="2" fillId="3" borderId="1" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1"/><xf fontId="3" applyFont="1"/></cellXfs></styleSheet>`;
 /* rows: array of arrays of cells; cell = value | {v, s, f}. opts: {widths, freeze(rowIndex of header), title} */
 function sheet(rows,o){let xml='';rows.forEach((r,ri)=>{xml+=`<row r="${ri+1}">`;r.forEach((c,ci)=>{if(c==null||c==='')return;const cc=(typeof c==='object')?c:{v:c};const ref=col(ci)+(ri+1);const s=cc.s??0;
   if(cc.f)xml+=`<c r="${ref}" s="${s}"><f>${x(cc.f)}</f></c>`;
   else if(typeof cc.v==='number'&&isFinite(cc.v))xml+=`<c r="${ref}" s="${s}"><v>${cc.v}</v></c>`;
   else if(cc.v!=null&&cc.v!=='')xml+=`<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${x(cc.v)}</t></is></c>`;});xml+='</row>';});
  const fr=o.freeze?`<sheetViews><sheetView workbookViewId="0"><pane ySplit="${o.freeze}" topLeftCell="A${o.freeze+1}" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>`:'';
  const cols=o.widths?`<cols>${o.widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols>`:'';
  const af=o.filter?`<autoFilter ref="${o.filter}"/>`:'';
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${fr}${cols}<sheetData>${xml}</sheetData>${af}</worksheet>`;}
 function book(sheetName,rows,o){const nm=x(sheetName.replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,31));
  return zip([
   ['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'],
   ['_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
   ['xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${nm}" sheetId="1" r:id="rId1"/></sheets>${o.filter?`<definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="0" hidden="1">'${nm}'!$${o.filter.replace(':',':$').replace(/([A-Z]+)(\d+)/g,'$1$$$2')}</definedName></definedNames>`:''}</workbook>`],
   ['xl/_rels/workbook.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'],
   ['xl/styles.xml',STY],
   ['xl/worksheets/sheet1.xml',sheet(rows,o)]]);}
 return {book,col};
})();
const today=()=>{const d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')};
const EXL={btn:{zh:'匯出 Excel',en:'Export Excel',vi:'Xuất Excel'},ok:{zh:'已匯出 ✓',en:'Exported ✓',vi:'Đã xuất ✓'},no:{zh:'已取消',en:'Cancelled',vi:'Đã hủy'},fail:{zh:'無法匯出',en:'Export failed',vi:'Không xuất được'}};
let DL=null; try{ if(window.claude&&window.claude.use) window.claude.use('downloads').then(d=>{DL=d}).catch(()=>{}); }catch(e){}
async function saveXlsx(btn,filename,blob){
 const lab=btn.textContent; const done=(m)=>{btn.textContent=T(m);setTimeout(()=>{if(btn.isConnected)btn.textContent=T(EXL.btn)},2500)};
 try{
  if(!DL&&window.claude&&window.claude.use){try{DL=await window.claude.use('downloads')}catch(e){}}
  if(DL){ await DL.save({filename,data:blob}); done(EXL.ok); return; }
  const url=URL_.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL_.revokeObjectURL(url),5000); done(EXL.ok);
 }catch(err){ done(err&&err.code==='declined'?EXL.no:EXL.fail); }
}
const URL_=window.URL;
const H=a=>a.map(h=>({v:T(h),s:1}));
function xPrice(){
 const X=PX; const hdr=[{zh:'SKU',en:'SKU',vi:'SKU'},{zh:'品名',en:'Product',vi:'Sản phẩm'},{zh:'規格',en:'Specs',vi:'Thông số'},{zh:'類別',en:'Category',vi:'Loại'},{zh:'狀態',en:'Status',vi:'Trạng thái'},{zh:'建議售價 ₫',en:'MSRP ₫',vi:'Giá bán lẻ ₫'},{zh:'≈ USD',en:'≈ USD',vi:'≈ USD'},{zh:'成本 ₫',en:'Cost ₫',vi:'Giá vốn ₫'},{zh:'Shopee 中位數 ₫',en:'Shopee median ₫',vi:'Shopee trung vị ₫'},{zh:'Shopee 最低 ₫',en:'Shopee low ₫',vi:'Shopee thấp nhất ₫'},{zh:'Shopee 最高 ₫',en:'Shopee high ₫',vi:'Shopee cao nhất ₫'},{zh:'官網',en:'Website',vi:'Website'}];
 const rows=[H(hdr)];
 P.forEach(p=>rows.push([p.sku,T(p.n),tv(p.s),T(CAT[p.cat]),p.st?T(X[p.st]):'',p.msrp?{v:p.msrp,s:2}:'',p.msrp?{v:Math.round(p.msrp/FX*100)/100,s:3}:'',p.cu!=null?{v:Math.round(p.cu*FX),s:2}:'',p.mk?{v:p.mk[0],s:2}:'',p.mk?{v:p.mk[1],s:2}:'',p.mk?{v:p.mk[2],s:2}:'',p.msrp?URL(p.sku):'']));
 rows.push([]);rows.push([T(X.cn)]);rows.push([T(X.mk)]);
 return XL.book(T(UI.price),rows,{freeze:1,widths:[8,34,60,14,14,14,9,13,16,15,15,40],filter:'A1:L'+(P.length+1)});
}
function xSamples(){
 const r=samRows(); const hdr=SX.h.slice(1,10).concat([{zh:'已點收',en:'Checked',vi:'Đã kiểm'}]);
 const rows=[H(hdr)]; const num=v=>v===''||v==null?'':(isNaN(+v)?v:{v:+v,s:2});
 r.forEach((x,i)=>rows.push([i+1,x.sku,dispName(x),num(x.q),num(x.b),dispSrc(x.src),num(x.c),x.size,dispNote(x.note),x.done?'✓':'']));
 const n=r.length+1; rows.push([{v:T(SX.tot),s:4},{v:'',s:4},{v:'',s:4},{f:`SUM(D2:D${n})`,s:5},{f:`SUM(E2:E${n})`,s:5},{v:'',s:4},{f:`SUM(G2:G${n})`,s:5},{v:'',s:4},{v:'',s:4},{v:'',s:4}]);
 return XL.book(T(UI.samples),rows,{freeze:1,widths:[5,8,40,10,12,22,9,16,28,9]});
}
function xChecklist(){
 const d=ckData(); const hdr=[CX.grp,CX.h[1],CX.h[2],CX.h[3],CX.h[4],{zh:'✓',en:'✓',vi:'✓'}];
 const rows=[H(hdr)]; d.forEach(g=>g.items.forEach(x=>rows.push([tv(g.g),tv(x.name),tv(x.qty),x.owner||'',tv(x.note),x.done?'✓':''])));
 return XL.book(T(UI.checklist),rows,{freeze:1,widths:[22,44,16,16,34,5],filter:'A1:F'+rows.length});
}

/* ---------- router & events ---------- */
const VIEWS={overview:vOverview,faq:vFaq,price:vPrice,samples:vSamples,checklist:vChecklist};
function cur(){const h=location.hash.replace('#','');return VIEWS[h]?h:'overview'}
function render(){
 document.documentElement.lang=L==='zh'?'zh-Hant':L;
 document.querySelectorAll('[data-t]').forEach(e=>e.innerHTML=T(UI[e.dataset.t]));
 document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===L));
 const v=cur();
 document.querySelectorAll('nav a').forEach(a=>{a.textContent=T(UI[a.dataset.v]);a.classList.toggle('on',a.dataset.v===v)});
 document.querySelectorAll('main section').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
 const sec=document.getElementById('v-'+v); sec.innerHTML=VIEWS[v]();
 if(v==='faq') renderFaqList();
 if(v==='samples') samTotals();
}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
document.addEventListener('click',e=>{
 const t=e.target;
 if(t.dataset.lang){L=t.dataset.lang;S.set('lang',L);render();}
 if(t.dataset.fc){fCat=t.dataset.fc;document.querySelectorAll('[data-fc]').forEach(b=>b.classList.toggle('on',b.dataset.fc===fCat));renderFaqList();}
 if(t.dataset.fx){document.querySelectorAll('details.faq').forEach(d=>d.open=t.dataset.fx==='1');}
 if(t.dataset.reset){S.set(t.dataset.reset,{});render();}
 if(t.dataset.xl){const k=t.dataset.xl;const nm={price:'PriceList',samples:'Samples',checklist:'Checklist'}[k];const blob={price:xPrice,samples:xSamples,checklist:xChecklist}[k]();saveXlsx(t,`VIEMAG_${nm}_${today()}.xlsx`,blob);}
 if(t.dataset.ckadd!=null&&t.dataset.ckadd!==undefined&&t.dataset.ckadd!==''){const d=ckData();const id='u'+Date.now();d[+t.dataset.ckadd].items.push({id,name:'',qty:'',note:'',owner:'',done:false});ckSave(d);render();const e=document.querySelector(`[data-cid="${id}"][data-f="name"]`);if(e){e.focus();e.scrollIntoView({block:'center'});}}
 if(t.dataset.ckdel){const d=ckData();d.forEach(g=>g.items=g.items.filter(x=>x.id!==t.dataset.ckdel));ckSave(d);render();}
 if(t.dataset.ckclr){const d=ckData();d.forEach(g=>g.items.forEach(x=>x.done=false));ckSave(d);render();}
 if(t.dataset.ckdef){if(t.dataset.arm){S.set('ckrows3',null);render();}else{t.dataset.arm='1';t.textContent=T(SX.sure);t.classList.add('warn');setTimeout(()=>{if(t.isConnected){delete t.dataset.arm;t.textContent=T(SX.def);t.classList.remove('warn')}},4000);}}
 if(t.dataset.ckcopy){const d=ckData();const H=[CX.grp,CX.h[1],CX.h[2],CX.h[3],CX.h[4]].map(T).concat(['✓']);
  const lines=[H.join('\t')];d.forEach(g=>g.items.forEach(x=>lines.push([tv(g.g),tv(x.name),tv(x.qty),x.owner||'',tv(x.note),x.done?'✓':''].join('\t'))));
  const ok=()=>{t.textContent=T(SX.copied);setTimeout(()=>{if(t.isConnected)t.textContent=T(SX.copy)},2000)},bad=()=>{t.textContent=T(SX.cfail)};
  try{navigator.clipboard.writeText(lines.join('\n')).then(ok,bad)}catch(err){bad()}}
 if(t.dataset.samadd){const r=samRows();const id='u'+Date.now();r.push({id,sku:'',name:'',q:'',b:'',src:'',c:'',size:'',note:'',done:false});samSave(r);render();const e=document.querySelector(`[data-id="${id}"][data-f="sku"]`);if(e){e.focus();e.scrollIntoView({block:'center'});}}
 if(t.dataset.del){samSave(samRows().filter(x=>x.id!==t.dataset.del));render();}
 if(t.dataset.samclr){const r=samRows();r.forEach(x=>x.done=false);samSave(r);render();}
 if(t.dataset.samdef){if(t.dataset.arm){S.set('samrows',null);S.set('sam',{});render();}else{t.dataset.arm='1';t.textContent=T(SX.sure);t.classList.add('warn');setTimeout(()=>{if(t.isConnected){delete t.dataset.arm;t.textContent=T(SX.def);t.classList.remove('warn')}},4000);}}
 if(t.dataset.samcopy){const r=samRows();const H=SX.h.slice(1,10).map(T);
  const lines=[H.join('\t')].concat(r.map((x,i)=>[i+1,x.sku,dispName(x),x.q,x.b,dispSrc(x.src),x.c,x.size,dispNote(x.note)].join('\t')));
  const ok=()=>{t.textContent=T(SX.copied);setTimeout(()=>{if(t.isConnected)t.textContent=T(SX.copy)},2000)},bad=()=>{t.textContent=T(SX.cfail)};
  try{navigator.clipboard.writeText(lines.join('\n')).then(ok,bad)}catch(err){bad()}}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='fq'){fQ=t.value;renderFaqList();}
 if(t.dataset.ow){const o=S.get('ow',{});o[t.dataset.ow]=t.value;S.set('ow',o);}
 if(t.classList.contains('ced')){const d=ckData();const [g,x]=ckFind(d,t.dataset.cid);if(!x)return;x[t.dataset.f]=t.value;t.classList.remove('empty');ckSave(d);}
 if(t.classList.contains('ed')){const r=samRows();const x=r.find(y=>y.id===t.dataset.id);if(!x)return;const f=t.dataset.f;let v=t.value;
  if(f==='sku'){v=v.trim().toUpperCase();x.sku=v;if(!x.name){const n=document.querySelector(`[data-id="${x.id}"][data-f="name"]`);if(n)n.value=dispName(x);}}
  else x[f]=v;
  if(f==='q'||f==='b')t.classList.toggle('empty',v==='');
  samSave(r);samTotals();}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.samck){const r=samRows();const x=r.find(y=>y.id===t.dataset.samck);if(x){x.done=t.checked;samSave(r);}t.closest('tr').classList.toggle('done',t.checked);samTotals();}
 if(t.dataset.ckid){const d=ckData();const [g,x]=ckFind(d,t.dataset.ckid);if(x){x.done=t.checked;ckSave(d);}t.closest('tr').classList.toggle('done',t.checked);ckCounts();}
});
render();
